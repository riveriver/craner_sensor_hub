# Project-wide Zephyr configuration.
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_GPIO=y

CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=y
CONFIG_REBOOT=y

CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=n
CONFIG_MCUMGR_GRP_IMG=n
CONFIG_MCUMGR_GRP_IMG_VERBOSE_ERR=n
CONFIG_MCUMGR_GRP_OS=n
CONFIG_MCUMGR_TRANSPORT_UDP=n
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=n
CONFIG_MCUMGR_TRANSPORT_UDP_IPV6=n
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_TCP_WORKQ_STACK_SIZE=4096

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_TELNET=n
CONFIG_SHELL_LOG_BACKEND=n

CONFIG_LOG=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=3
CONFIG_LOG_CMDS=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_RATELIMIT=y
CONFIG_LOG_RATELIMIT_INTERVAL_MS=5000
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_NET=n
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=50
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=n

CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.18.32"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.18.1"

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_STM32_HAL=y
CONFIG_ETH_STM32_HW_CHECKSUM=n
CONFIG_PHY_GENERIC_MII=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=n
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_LOG=y
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_ETHERNET=y
CONFIG_NET_MAX_CONN=16
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_SOCKETS_SERVICE_THREAD_PRIO=-1
CONFIG_ZVFS_POLL_MAX=9
CONFIG_ENTROPY_GENERATOR=y
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_TIMESLICING=n

CONFIG_POSIX_API=y

# Application thread selection.
CONFIG_CRANER_ENABLE_SYSTEM_HEALTH_THREAD=n
CONFIG_CRANER_ENABLE_MODBUS_TCP_SERVER_THREAD=n
CONFIG_CRANER_ENABLE_READ_SLEWING_ENCODER_THREAD=n
CONFIG_CRANER_ENABLE_READ_LUFFING_ENCODER_THREAD=n
CONFIG_CRANER_ENABLE_READ_HOISTING_ENCODER_THREAD=n
CONFIG_CRANER_ENABLE_OTA_CONTROL=n

