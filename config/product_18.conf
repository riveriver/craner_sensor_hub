# Product-specific configuration for the 192.168.18.x deployment.

# Leave static IPv4 empty so network_manager_service starts DHCPv4.
CONFIG_NETWORK_STATIC_IPV4_ADDR=""
CONFIG_NETWORK_STATIC_IPV4_NETMASK=""
CONFIG_NETWORK_STATIC_IPV4_GW=""

# The field network bridge/PHY can need extra time after its load switch turns on.
CONFIG_NETWORK_MANAGER_STARTUP_DELAY_MS=3000
CONFIG_NETWORK_MANAGER_IF_UP_RETRY_PERIOD_MS=1000
CONFIG_NETWORK_MANAGER_IF_UP_MAX_RETRIES=0

# Maintenance address used only when DHCP does not obtain a lease in time.
CONFIG_NETWORK_RESCUE_IPV4_ADDR="192.168.250.32"
CONFIG_NETWORK_RESCUE_IPV4_NETMASK="255.255.255.0"
CONFIG_NETWORK_RESCUE_IPV4_GW="192.168.250.1"

# Hostname, mDNS name, MQTT client id, and MAC are generated by
# device_identity_service from these product defaults and the hardware UID.
CONFIG_DEVICE_IDENTITY_DEFAULT_COMPANY="craner"
CONFIG_DEVICE_IDENTITY_DEFAULT_MODEL="encoder-hub"
CONFIG_DEVICE_IDENTITY_DEFAULT_PRODUCT=""
