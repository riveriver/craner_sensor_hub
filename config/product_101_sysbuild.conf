# Sysbuild configuration for product 101.
#
# Keep bootloader signing settings out of the APP product
# config. The build workflow selects this file through project_config.json
# Build.SysbuildConf.

SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="keys/craner_sensor_hub_keyv1_prod_ec256_20260828.pem"
